version: 2

project_name: packer-plugin-proxmox-lxc

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./
    binary: packer-plugin-proxmox-lxc_{{ .Version }}_x5.0_{{ .Os }}_{{ .Arch }}
    ldflags:
      - "-s -w -X github.com/leoarry/packer-plugin-proxmox-lxc/version.Version={{.Version}}"

archives:
  - format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_x5.0_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_x5.0_SHA256SUMS'

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  disable: false
  prerelease: auto
